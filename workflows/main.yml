name: Build DriveVerse IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild archive \
            -project DriveVerse.xcodeproj \
            -scheme DriveVerse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath DriveVerse.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R DriveVerse.xcarchive/Products/Applications/DriveVerse.app Payload/
          zip -r DriveVerse.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveVerse-IPA
          path: DriveVerse.ipa
